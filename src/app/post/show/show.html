<div class="card mt-5">
    <h3 class="card-header p-3">Show Post</h3>
    <div class="card-body">

        <div class="m-1">
            <a [routerLink]="['/post']" class="btn btn-primary btn-sm">Back</a>
        </div>

        <div>
            <p><strong>Title: </strong> {{ title }}</p>
            <p><strong>Body: </strong> {{ body }}</p>
            <p><strong>Comment: </strong> {{ comment }}</p>
        </div>

    </div>
</div>
