<div class="feed-container">
  <!-- Enlace para volver al feed -->
  <div class="create-back-row">
    <a [routerLink]="['/post']" class="create-back-link">
      Regresar.
    </a>
  </div>

  <!-- Tarjeta de creación de publicación -->
  <article class="create-card">
    <header class="create-header">
      <div class="create-header-text">
        <h3 class="create-title">Crear publicación</h3>
        <span class="create-subtitle">
          Escribe lo que piensas y compártelo con el mundo.
        </span>
      </div>
    </header>

    <form
      (ngSubmit)="submit()"
      class="create-form"
      enctype="multipart/form-data"
    >

      <!-- Título -->
      <div class="create-field">
        <input
          [(ngModel)]="title"
          type="text"
          name="title"
          id="title"
          class="create-input"
          placeholder="Título de tu publicación"
        />
      </div>

      <!-- Cuerpo -->
      <div class="create-field">
        <textarea
          [(ngModel)]="body"
          name="body"
          id="body"
          class="create-textarea"
          rows="4"
          placeholder="¿Qué quieres compartir hoy?"
        ></textarea>
      </div>

      <!-- Comentario -->
      <div class="create-field">
        <textarea
          [(ngModel)]="comment"
          name="comment"
          id="comment"
          class="create-textarea"
          rows="3"
          placeholder="Escribe un comentario adicional (opcional)…"
        ></textarea>
      </div>

      <!-- Subir foto -->
      <div class="create-field create-upload-box">
        <label class="upload-label" for="imageInput">Añadir foto (opcional)</label>
        <input
          type="file"
          id="imageInput"
          class="upload-input"
          accept="image/*"
          (change)="onFileSelected($event)"
        />
      </div>

      <!-- Mensajes -->
      
      @if (error) {
        <div class="create-error">
          <span>{{ error }}</span>
        </div>
      }

      @if (success) {
        <div class="create-success">
          <span>{{ success }}</span>
        </div>
      }

      <!-- Acciones -->
      <footer class="create-actions">
        <button type="submit" class="create-btn-primary">
          Publicar
        </button>
      </footer>
    </form>
  </article>
</div>
