<div class="card mt-5">
  <h3 class="card-header p-3">Create a Comment in Post</h3>
  <div class="card-body">

    <div class="m-1">
      <a [routerLink]="['/post']" class="btn btn-primary btn-sm">Back</a>
    </div>

    <form (ngSubmit)="submit()">
      <div>
        <p><strong>Title: </strong> {{ title }}</p>
        <p><strong>Body: </strong> {{ body }}</p>
      </div>
      <div class="mt-2">
        <label for="comment">Comment:</label>
        <textarea [(ngModel)]="comment" name="comment" id="comment" class="form-control"></textarea>
      </div>

        @if (error) {
        <div>
            <span class="text-danger">{{ error }}</span>
        </div>
        }

      <div class="mt-2">
        <button class="btn btn-success" type="submit">Submit</button>
      </div>
    </form>

  </div>
</div>
