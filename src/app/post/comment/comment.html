<!-- Botón atrás -->
<div class="comment-back-row">
  <a [routerLink]="['/post']" class="comment-back-link">
    ← Volver
  </a>
</div>

<!-- Tarjeta principal -->
<div class="comment-card">
  <header class="comment-header">
    <div class="comment-avatar">💬</div>
    <div class="comment-header-text">
      <h2 class="comment-title">Agregar comentario</h2>
      <p class="comment-subtitle">Estás comentando esta publicación:</p>
    </div>
  </header>

  <!-- Vista previa del post -->
  <section class="comment-post-preview">
    <h3 class="comment-post-title">{{ title }}</h3>
    <p class="comment-post-body">{{ body }}</p>

    <!-- Imagen si existe -->
    <div class="comment-image-wrapper" *ngIf="imageUrl">
      <img
        [src]="'http://localhost:8000' + imageUrl"
        alt="Imagen de la publicación"
        class="comment-image"
      />
    </div>
  </section>

  <!-- Formulario -->
  <form (ngSubmit)="submit()" class="comment-form">
    <div class="comment-field">
      <label for="comment">Tu comentario</label>
      <textarea
        [(ngModel)]="comment"
        name="comment"
        id="comment"
        class="comment-textarea"
        placeholder="Escribe algo chévere…"
      ></textarea>
    </div>

    <!-- Mensajes -->
    @if (error) {
      <div class="comment-error">
        <span>{{ error }}</span>
      </div>
    }

    @if (success) {
      <div class="comment-success">
        <span>{{ success }}</span>
      </div>
    }

    <div class="comment-actions">
      <button class="comment-btn-primary" type="submit">
        Guardar comentario
      </button>
    </div>
  </form>
</div>
