<div class="card mt-5">
  <h3 class="card-header p-3">Angular CRUD App</h3>

  <div class="card-body">

    <div class="m-1">
      <a [routerLink]="['/posts/create']" class="btn btn-success btn-sm">Create Post</a>
    </div>

    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Id</th>
          <th>Title</th>
          <th>Body</th>
          <th>Comments</th>
          <th>Image</th> <!-- ✅ new column -->
          <th width="250px">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for(post of posts; track post._id) {
        <tr>
          <td>{{ post._id }}</td>
          <td>{{ post.title }}</td>
          <td>{{ post.body }}</td>
          <td>{{ post.comment }}</td>

          <!-- ✅ Show thumbnail if image exists -->
          <td>
            <div *ngIf="post.imageUrl; else noImage">
              <img src="http://localhost:8000{{ post.imageUrl }}" alt="Post image" class="post-image">
            </div>
            <ng-template #noImage>
              <span class="text-muted">No image</span>
            </ng-template>
          </td>

          <td>
            <a [routerLink]="['/posts', post._id]" class="btn btn-info btn-sm m-1">Show</a>
            <a [routerLink]="['/posts', post._id, 'edit']" class="btn btn-primary btn-sm m-1">Edit</a>
            <a [routerLink]="['/posts', post._id, 'comment']" class="btn btn-primary btn-sm m-1">Comment</a>
            <button (click)="deletePost(post._id)" class="btn btn-danger btn-sm">Delete</button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
