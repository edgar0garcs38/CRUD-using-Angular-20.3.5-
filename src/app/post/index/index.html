<div class="feed-container">
  <div class="feed-header">
    <h3 class="feed-title">Bienvenido !!!</h3>
  </div>

  <!-- Caja tipo "¿Qué estás pensando?" -->
  <div class="composer-card" [routerLink]="['/posts/create']">
    <span class="composer-placeholder">Publica algo chévere…</span>
  </div>

  <div class="post-list">
    @for (post of posts; track post._id) {
      <article class="post-card">
        
        <!-- Encabezado del post -->
        <header class="post-card-header">
          <div class="composer-avatar">👤</div>
          <div class="post-header-text">
            <h4 class="post-title">{{ post.title }}</h4>
          </div>
        </header>

        <!-- Contenido del post -->
        <p class="post-body">
          {{ post.body }}
        </p>

        <!-- Acciones -->
        <footer class="post-card-actions">
          
          <!-- Comentar -->
          <a
            [routerLink]="['/posts', post._id, 'comment']"
            class="icon-action icon-comment"
          >
            <span class="icon-emoji">💬</span>
            <span class="icon-label">Comentar</span>
          </a>

          <!-- Editar -->
          <a
            [routerLink]="['/posts', post._id, 'edit']"
            class="icon-action icon-edit"
          >
            <span class="icon-emoji">✏️</span>
            <span class="icon-label">Editar</span>
          </a>

          <!-- Eliminar -->
          <button
            type="button"
            (click)="deletePost(post._id)"
            class="icon-action icon-delete"
          >
            <span class="icon-emoji">🗑️</span>
            <span class="icon-label">Eliminar</span>
          </button>

        </footer>

      </article>
    }
  </div>
</div>
