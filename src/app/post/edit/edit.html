<div class="feed-container">
  <!-- Enlace para volver al feed -->
  <div class="edit-back-row">
    <a [routerLink]="['/post']" class="edit-back-link">
      Volver
    </a>
  </div>

  <!-- Tarjeta de edición de publicación -->
  <article class="edit-card">
    <header class="edit-header">
      <div class="edit-header-text">
        <h3 class="edit-title">Editar publicación</h3>
        <span class="edit-subtitle">
          Ajusta el contenido de tu post.
        </span>
      </div>
    </header>

    <form
      (ngSubmit)="submit()"
      class="edit-form"
      enctype="multipart/form-data"
    >
      <!-- Título -->
      <div class="edit-field">
        <input
          [(ngModel)]="title"
          type="text"
          name="title"
          id="title"
          class="edit-input"
          placeholder="Edita el título de tu publicación"
        />
      </div>

      <!-- Cuerpo -->
      <div class="edit-field">
        <textarea
          [(ngModel)]="body"
          name="body"
          id="body"
          class="edit-textarea"
          rows="4"
          placeholder="Actualiza el contenido de tu publicación"
        ></textarea>
      </div>

      <!-- Comentario -->
      <div class="edit-field">
        <textarea
          [(ngModel)]="comment"
          name="comment"
          id="comment"
          class="edit-textarea"
          rows="3"
          placeholder="Actualiza el comentario (opcional)…"
        ></textarea>
      </div>

      <!-- Cambiar imagen -->
      <div class="edit-field create-upload-box">
        <label class="upload-label" for="imageEditInput">
          Cambiar imagen (opcional)
        </label>
        <input
          type="file"
          id="imageEditInput"
          class="upload-input"
          accept="image/*"
          (change)="onFileSelected($event)"
        />
      </div>

      <!-- Mensajes -->
      @if (error) {
        <div class="edit-error">
          <span>{{ error }}</span>
        </div>
      }

      @if (success) {
        <div class="edit-success">
          <span>{{ success }}</span>
        </div>
      }

      <!-- Botón -->
      <footer class="edit-actions">
        <button type="submit" class="edit-btn-primary">
          Guardar cambios
        </button>
      </footer>
    </form>
  </article>
</div>
