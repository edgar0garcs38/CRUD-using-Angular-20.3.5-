<div class="feed-container">
  <!-- Enlace para volver al feed -->
  <div class="edit-back-row">
    <a [routerLink]="['/post']" class="edit-back-link">
      Volver
    </a>
  </div>

  <!--  edición de publicación -->
  <article class="edit-card">
    <header class="edit-header">
      <div class="edit-header-text">
        <h3 class="edit-title">Editar publicación</h3>
        <span class="edit-subtitle">
          Ajusta el contenido de tu post.
        </span>
      </div>
    </header>

    <form (ngSubmit)="submit()" class="edit-form">
      <div class="edit-field">
        <input
          [(ngModel)]="title"
          type="text"
          name="title"
          id="title"
          class="edit-input"
          placeholder="Edita el título de tu publicación"
        />
      </div>

      <div class="edit-field">
        <textarea
          [(ngModel)]="body"
          name="body"
          id="body"
          class="edit-textarea"
          rows="4"
          placeholder="Actualiza el contenido de tu publicación"
        ></textarea>
      </div>

      @if (error) {
        <div class="edit-error">
          <span>{{ error }}</span>
        </div>
      }

      <footer class="edit-actions">
        <button type="submit" class="edit-btn-primary">
          Guardar cambios
        </button>
      </footer>
    </form>
  </article>
</div>
